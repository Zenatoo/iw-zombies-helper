[package]
name = "iw-helper-gui"
version = "1.1.0"
edition = "2021"
description = "iw-helper's graphical interface: a Tauri window whose pages are written in TypeScript"
license = "GPL-3.0-or-later"

[[bin]]
name = "iw-helper-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
iw-helper = { path = "../.." }
serde = { version = "1", features = ["derive"] }
# "custom-protocol": the pages from gui/dist are built into the executable, even by a plain
# `cargo build`. So there is nothing to serve or download while the program runs.
tauri = { version = "2", features = ["custom-protocol"] }
# The window asking which game to start (Windows task dialog, from comctl32 6, which the executable's
# manifest asks for).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The tests check the names of the fields sent to the pages.
serde_json = "1"
